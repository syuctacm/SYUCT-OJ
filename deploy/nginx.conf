server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Record-list status stream.
    location = /api/v1/submissions/events {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # The SPA calls the same-origin /api prefix; proxy it to the Go service.
    # The API sets its own security headers, so this location must not inherit
    # the SPA ones (nginx only inherits add_header when the location has none).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hydrojudge endpoints: login, file links, uploads and the WebSocket.
    location /judge/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # POST /login is hydrojudge's login; GET /login is the SPA page.
    location = /login {
        if ($request_method = POST) {
            proxy_pass http://api:8080;
            break;
        }
        try_files $uri /index.html;
    }

    # POST /d/<domain>/judge/files is hydrojudge's file-link endpoint; GET /d/...
    # is the SPA legacy-domain redirect.
    location /d/ {
        if ($request_method = POST) {
            proxy_pass http://api:8080;
            break;
        }
        try_files $uri /index.html;
    }

    # SPA fallback for client-side routes. TLS is expected to terminate in
    # front of this container.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
