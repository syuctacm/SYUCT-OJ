{% extends "layout/immersive.html" %}
{% block content %}
<div class="immersive--content immersive--center">
  <h1>注销账号</h1>
  <div class="text-center typo">
    <p>账号将在 7 天后匿名化。题目、比赛、提交等公共业务内容会保留，但个人资料和认证数据会被删除。</p>
    <p>在宽限期内可以随时取消。</p>
  </div>
  <form method="POST">
    <div class="row"><div class="columns">
      <label class="inverse material textbox">
        当前密码
        <input name="password" type="password" autofocus required>
      </label>
    </div></div>
    <div class="text-center">
      <input type="submit" value="确认注销" class="inverse rounded danger button">
    </div>
  </form>
</div>
{% endblock %}
